[package]
name = "map-design"
version = "0.4.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
serde = { version = "1", features = ["derive"] }
rfd = { version = "0.15", default-features = false }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = true
opt-level = "s"
lto = "thin"
codegen-units = 1
